# Golden Queries for RAG Retrieval Drift Monitoring
#
# This bench is intentionally configured as a hybrid retrieval smoke test:
# vector search alone is too brittle for long books, legal/patent identifiers,
# standards documents, and multilingual titles. Keep the first version broad
# enough to catch real drift without alerting on harmless Part/Synthesis swaps.

queries:
  - query: "Taylor's theorem for functions of several variables"
    expected_top_k:
      - "TRENCH_REAL_ANALYSIS (Stitched)"
      - "TRENCH_REAL_ANALYSIS (Part 105)"
      - "TRENCH_REAL_ANALYSIS (Part 83)"
    top_k: 5
    hybrid: true

  - query: "variational formulation Lax-Milgram lemma weak solution"
    expected_top_k:
      - "Partial Differential Equations with Numerical Methods (Part 51)"
      - "Partial Differential Equations with Numerical Methods (Part 61)"
      - "Partial Differential Equations with Numerical Methods (Part 47)"
      - "Partial Differential Equations with Numerical Methods (Synthesis)"
      - "Partial Differential Equations with Numerical Methods (Stitched)"
    top_k: 5
    hybrid: true

  - query: "Siddhartha meets Kamala by the river"
