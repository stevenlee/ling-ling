id: synthesize_critique_demo
description: |
  Phase 5A demo: synthesize → critique against real LLMClient adapters.

  Adapter names match `services/builtin_adapters.py`. To run this in tests
  without burning LLM credits, register fixture callables under the same
  names — the runner cares only about the registered binding, not where
  the callable lives.

  Demonstrates: variable resolution from `${context.X}` and
  `${steps.<id>.<key>}`, structured `when:` skipping the critique step
  when synthesis produces nothing, and TraceStore artifact propagation.

steps:
  - id: synthesize
    capability: synthesize
    adapter: llm.synthesize
    inputs:
      part_digests: "${context.part_digests}"
      title:        "${context.title}"

  - id: critique
    capability: critique
    adapter: llm.critique
    when:
      var: steps.synthesize.output
      op: nonempty
    inputs:
      candidate: "${steps.synthesize.output}"
      sources:   "${context.part_digests_text}"
